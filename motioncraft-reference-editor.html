<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionCraft — Visual Editor</title>
<style>
:root{
  --bg:#e5e3ed;--panel:#fff;--ink:#211f31;--muted:#777486;--line:#e9e7ef;
  --soft:#f0eff4;--purple:#3210e8;--purple2:#8f2de8;--radius:27px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;min-height:700px;position:relative;overflow:hidden;background:linear-gradient(135deg,#e9e7f0 0%,#dfdce9 100%)}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1190px,calc(100vw - 72px));height:min(800px,calc(100dvh - 72px));display:grid;grid-template-columns:328px 328px 328px;column-gap:36px;align-items:start}
.panel{background:rgba(255,255,255,.96);border-radius:27px;box-shadow:0 1px 2px rgba(39,34,59,.015);overflow:hidden}
.left{height:100%;display:flex;flex-direction:column}
.switcher{height:75px;padding:15px 18px 0;display:flex;align-items:flex-start}
.switch-inner{height:56px;width:100%;background:#f0eff3;border-radius:30px;padding:4px;display:flex;align-items:center;gap:2px}
.switch{height:48px;border:0;background:transparent;color:#777486;border-radius:25px;padding:0 17px;display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.1px}
.switch.active{background:#242137;color:#fff;box-shadow:0 2px 4px #18152b1a}
.switch svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.switch.search{margin-left:auto;padding:0 9px}
.accordion{border-top:1px solid var(--line)}
.accordion:first-of-type{border-top:0}
.acc-head{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 23px;font-size:16px;font-weight:650;cursor:pointer;user-select:none}
.chevron{width:9px;height:9px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg);margin-right:4px;margin-top:-5px;transition:.2s}
.collapsed .chevron{transform:rotate(-45deg);margin-top:0}
.acc-body{padding:2px 28px 24px}
.content-grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:15px;row-gap:22px}
.content-item{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#6d6a7b;padding:4px 0 0;position:relative}
.content-item:hover{background:#faf9fc}
.content-item:focus-visible{outline:2px solid #9b7aff}
.content-item .ico{height:40px;width:42px;display:grid;place-items:center;color:#27243a}
.content-item svg{width:39px;height:39px;stroke:currentColor;fill:none;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.content-item span{font-size:16px}
.content-item.disabled{border:1.5px dashed #d3d0da;color:#aaa7b2}
.content-item.disabled svg{opacity:.3}
.content-item.disabled:after{content:"";position:absolute;top:29px;width:24px;height:9px;background:#d1cfd7;border-radius:1px}
.content-item.disabled span{margin-top:0}
.typography{padding-bottom:18px}
.structure,.media{border-top:1px solid var(--line)}
.structure .acc-head,.media .acc-head{height:69px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 15px}
.middle{height:auto;display:flex;flex-direction:column;gap:35px;background:transparent;overflow:visible}
.card{background:rgba(255,255,255,.86);border-radius:27px;padding:23px 22px;box-shadow:0 1px 2px rgba(39,34,59,.012)}
.card-title{height:25px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:13px}
.arrow{font-size:27px;font-weight:300;line-height:1;color:#262338;transform:translateY(-1px)}
.setting-row{height:50px;display:grid;grid-template-columns:88px 1fr;align-items:center;gap:0;color:#777486;font-size:16px}
.value-pill{height:39px;border-radius:24px;background:#eeedf2;display:flex;align-items:center;padding:0 9px;gap:12px;color:#29263a;font-size:15px;min-width:0}
.color-dot{height:32px;width:32px;border-radius:50%;background:#fff;flex:none;border:1px solid #e8e6ec;box-shadow:0 0 0 4px #fff}
.color-dot.purple{background:#b009db;border:0;box-shadow:0 0 0 4px #fff}
.color-dot.pink{background:#d463fc;border:0;box-shadow:0 0 0 4px #fff}
.value-pill input[type=color]{width:1px;height:1px;opacity:0;position:absolute}
.value-pill .hex{white-space:nowrap}
.button-card{padding-bottom:22px}
.font-select{border:0;outline:0;background:transparent;color:#29263a;font-size:15px;width:100%;appearance:none}
.select-wrap{position:relative;width:100%}
.select-wrap:after{content:"";position:absolute;right:4px;top:6px;border:4px solid transparent;border-top-color:#8d8998;transform:translateY(3px);pointer-events:none}
.weight-pill{padding-right:16px}
.compact-pill{height:39px;border-radius:24px;background:#eeedf2;display:flex;align-items:center;justify-content:center;color:#29263a;font-size:15px;padding:0 12px}
.size-row{display:grid;grid-template-columns:1fr 1px 1fr;gap:11px;align-items:center}
.vdivider{height:23px;background:#d8d5df}
.alignment{height:42px;border-radius:24px;background:#eeedf2;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:3px;gap:3px}
.align-btn{height:34px;border:0;border-radius:20px;background:transparent;color:#39364a;display:grid;place-items:center}
.align-btn.active{background:#242137;color:#fff}
.align-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.style-pill{height:40px;border-radius:24px;background:#eeedf2;display:flex;align-items:center;padding:3px;gap:2px}
.style-btn{height:34px;min-width:34px;border:0;border-radius:18px;background:transparent;color:#343145;display:grid;place-items:center;font-size:17px}
.style-btn.active{background:#242137;color:white}
.style-sep{height:22px;width:1px;background:#d1ced9;margin:0 4px}
.ai-button{height:62px;border:0;border-radius:35px;color:#fff;font-size:17px;font-weight:600;letter-spacing:.1px;background-color:#3210e8;background-image:radial-gradient(circle,rgba(255,255,255,.13) 1.6px,transparent 1.8px),linear-gradient(105deg,#3210e8,#3b13ec);background-size:16px 16px,100% 100%;box-shadow:0 4px 10px #3613df10;display:flex;align-items:center;justify-content:center;gap:10px}
.ai-button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.right{height:100%;background:transparent;display:flex;flex-direction:column;gap:35px;overflow:visible}
.toolbar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tool-left{display:flex;gap:9px}
.circle-tool{height:44px;width:44px;border:0;border-radius:50%;background:#d7d5e1;color:#28253a;display:grid;place-items:center}
.circle-tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.top-action{height:44px;border:0;border-radius:24px;padding:0 19px;background:#d7d5e1;color:#28253a;font-size:16px}
.save-wrap{position:relative}
.save{height:44px;border:0;border-radius:24px;padding:0 17px;background:#3210e8;color:#fff;font-size:16px;display:flex;align-items:center;gap:10px}
.save .down{font-size:12px}
.save-menu{position:absolute;right:0;top:51px;width:165px;background:white;border-radius:13px;box-shadow:0 12px 30px #211b3826;padding:7px;display:none;z-index:10}
.save-menu.show{display:block}
.save-menu button{width:100%;border:0;background:#fff;text-align:left;padding:10px;border-radius:8px;color:#514d5d;font-size:13px}
.save-menu button:hover{background:#f5f2fb}
.right-card{padding:23px 22px 22px}
.padding-card{height:234px}
.padding-diagram{height:114px;border-radius:12px;position:relative;overflow:hidden;background:#dedce5;margin-top:5px;display:grid;grid-template-columns:62px 1fr 62px;grid-template-rows:38px 1fr 38px;align-items:center;justify-items:center;color:#5f5b6d;font-size:16px}
.padding-diagram .top{grid-column:2;grid-row:1}
.padding-diagram .bottom{grid-column:2;grid-row:3}
.padding-diagram .left-label{grid-column:1;grid-row:2}
.padding-diagram .right-label{grid-column:3;grid-row:2}
.padding-diagram:before{content:"";position:absolute;inset:0;background:linear-gradient(34deg,transparent 49.6%,#c9c7d1 50%) top left/50% 50% no-repeat,linear-gradient(-34deg,transparent 49.6%,#c9c7d1 50%) top right/50% 50% no-repeat,linear-gradient(-34deg,transparent 49.6%,#c9c7d1 50%) bottom left/50% 50% no-repeat,linear-gradient(34deg,transparent 49.6%,#c9c7d1 50%) bottom right/50% 50% no-repeat}
.padding-center{position:absolute;left:23%;right:23%;height:27px;top:50%;transform:translateY(-50%);border-radius:5px;background:#3a374d;z-index:1}
.padding-diagram span{z-index:2}
.checkline{display:flex;align-items:center;gap:9px;font-size:14px;margin-top:15px}
.checkline input{accent-color:#211d38;width:16px;height:16px;margin:0}
.link-card{height:121px}
.link-row{display:flex;gap:9px;align-items:center}
.type-select{height:40px;border:1px solid #e5e2eb;border-radius:22px;background:#fff;color:#777385;padding:0 14px;font-size:14px}
.url-field{height:40px;min-width:0;flex:1;border:1.5px solid #39364a;border-radius:22px;background:#fff;display:flex;align-items:center;padding:0 10px 0 14px;gap:8px}
.url-field input{border:0;outline:0;min-width:0;width:100%;font-size:14px;color:#302d40;background:transparent}
.valid{width:17px;height:17px;flex:none;border-radius:50%;background:#20c64d;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#272438;color:white;padding:11px 18px;border-radius:12px;font-size:13px;box-shadow:0 8px 25px #25203b26;transition:.22s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:#1d193533;display:none;align-items:center;justify-content:center;z-index:30}
.modal-backdrop.show{display:flex}
.modal{width:min(460px,calc(100vw - 30px));background:#fff;border-radius:22px;padding:25px;box-shadow:0 20px 70px #201b3b35}
.modal h3{margin:0 0 8px;font-size:19px}.modal p{color:#777486;font-size:13px;line-height:1.7}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-actions button{border:0;border-radius:10px;padding:10px 16px;background:#f0eef5;color:#514d5c}.modal-actions .primary{background:#3210e8;color:#fff}
@media(max-width:1100px){
 .stage{width:calc(100vw - 40px);grid-template-columns:minmax(270px,1fr) minmax(270px,1fr) minmax(270px,1fr);gap:22px}
 .switch{padding:0 12px;font-size:15px}.card{padding-left:18px;padding-right:18px}
}
@media(max-width:850px){
 html,body{overflow:auto}.app{height:auto;min-height:100vh;overflow:visible;padding:25px 0}
 .stage{position:relative;left:auto;top:auto;transform:none;width:min(680px,calc(100vw - 30px));height:auto;margin:0 auto;display:flex;flex-direction:column;gap:20px}
 .panel,.middle,.right{width:100%;height:auto}.left{min-height:650px}.middle{gap:20px}.right{gap:20px}
 .toolbar{order:-1}.padding-card{height:234px}.card{width:100%}
}
</style>
</head>
<body>
<div class="app">
 <main class="stage">
  <!-- Left: content library -->
  <aside class="panel left">
   <div class="switcher">
    <div class="switch-inner">
     <button class="switch active" data-mode="content" onclick="switchLibrary('content',this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.1" fill="currentColor" stroke="none"/><circle cx="14" cy="5" r="2.1" fill="currentColor" stroke="none"/><circle cx="17" cy="15" r="2.1" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="2.1" fill="currentColor" stroke="none"/><path d="M8 8.5l4.2-2M8 15.5l7-1"/></svg>Content
     </button>
     <button class="switch" data-mode="rows" onclick="switchLibrary('rows',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5"/><rect x="3" y="15" width="18" height="5"/></svg>Rows
     </button>
     <button class="switch search" title="搜索" onclick="toggleSearch()"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
    </div>
   </div>
   <div id="searchBox" style="display:none;padding:0 22px 12px"><input id="searchInput" placeholder="Search elements..." style="height:36px;width:100%;border:1px solid #e8e5ed;border-radius:10px;padding:0 12px;outline:none"></div>
   <section class="accordion" id="basicAcc">
    <div class="acc-head" onclick="toggleAccordion('basicAcc')"><span>Basic</span><i class="chevron"></i></div>
    <div class="acc-body">
     <div class="content-grid">
      <button class="content-item" onclick="insertItem('Image')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M7 13V7h21M28 7v8M28 7h8"/><path d="M7 17v20h31V17H7z"/><path d="m12 32 8-9 5 6 4-4 6 7H12z" fill="#27243a" stroke="none"/><circle cx="30" cy="22" r="2"/></svg></div><span>Image</span></button>
      <button class="content-item" onclick="insertItem('Video')"><div class="ico"><svg viewBox="0 0 44 44"><rect x="4" y="10" width="27" height="25"/><path d="m31 18 9-6v21l-9-6z"/><path d="M17 16v13m-6.5-6.5h13"/></svg></div><span>Video</span></button>
      <button class="content-item disabled" onclick="insertItem('Button')"><div class="ico"><svg viewBox="0 0 44 44"><rect x="6" y="17" width="32" height="10" rx="1"/></svg></div><span>Button</span></button>
      <button class="content-item" onclick="insertItem('GIF')"><div class="ico"><svg viewBox="0 0 44 44"><rect x="5" y="5" width="34" height="34"/><text x="10" y="27" font-size="12" fill="currentColor" stroke="none" font-weight="600">GIF</text></svg></div><span>GIF</span></button>
      <button class="content-item" onclick="insertItem('File')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M13 37c-5 0-8-4-8-9V14c0-5 3-9 8-9s8 4 8 9v15c0 2-1 4-3 4s-3-2-3-4V15c0-1-1-2-2-2s-2 1-2 2v14"/><path d="M29 19v18m-8-9h16m-8-9 7 8"/></svg></div><span>File</span></button>
     </div>
    </div>
   </section>
   <section class="accordion typography" id="typeAcc">
    <div class="acc-head" onclick="toggleAccordion('typeAcc')"><span>Typography</span><i class="chevron"></i></div>
    <div class="acc-body">
     <div class="content-grid">
      <button class="content-item" onclick="insertItem('Title')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M8 9h28M22 9v29M9 39h26"/></svg><span style="position:absolute;top:2px;font-size:24px;color:#242137">T</span></div><span>Title</span></button>
      <button class="content-item" onclick="insertItem('Text Block')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M4 13h36M4 22h36M4 31h27"/></svg></div><span>Text Block</span></button>
      <button class="content-item" onclick="insertItem('List')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M5 12h26M5 22h26M5 32h26M34 10v24m-6-7 6 7 6-7"/></svg></div><span>List</span></button>
      <button class="content-item" onclick="insertItem('Quote')"><div class="ico"><svg viewBox="0 0 44 44"><text x="5" y="28" font-size="17" fill="currentColor" stroke="none" font-weight="700">99</text><path d="M6 36h31"/></svg></div><span>Quote</span></button>
      <button class="content-item" onclick="insertItem('Link')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M17 27 13 31a7 7 0 0 1-10-10l7-7a7 7 0 0 1 10 0m7 3 4-4a7 7 0 0 1 10 10l-7 7a7 7 0 0 1-10 0m-13-5h16"/></svg></div><span>Link</span></button>
     </div>
    </div>
   </section>
   <section class="accordion structure collapsed" id="structureAcc">
    <div class="acc-head" onclick="toggleAccordion('structureAcc')"><span>Structure</span><i class="chevron"></i></div>
    <div class="acc-body" style="display:none"><div class="content-grid"><button class="content-item" onclick="insertItem('Container')"><div class="ico"><svg viewBox="0 0 44 44"><rect x="5" y="7" width="34" height="30" rx="2"/><path d="M5 17h34"/></svg></div><span>Container</span></button><button class="content-item" onclick="insertItem('Columns')"><div class="ico"><svg viewBox="0 0 44 44"><rect x="5" y="7" width="34" height="30"/><path d="M22 7v30"/></svg></div><span>Columns</span></button></div></div>
   </section>
   <section class="accordion media collapsed" id="mediaAcc">
    <div class="acc-head" onclick="toggleAccordion('mediaAcc')"><span>Media</span><i class="chevron"></i></div>
    <div class="acc-body" style="display:none"><div class="content-grid"><button class="content-item" onclick="insertItem('Audio')"><div class="ico"><svg viewBox="0 0 44 44"><path d="M7 25h6l7-8v20l-7-8H7zM28 18q8 7 0 14m5-19q13 12 0 24"/></svg></div><span>Audio</span></button></div></div>
   </section>
  </aside>

  <!-- Middle: color and typography controls -->
  <section class="middle">
   <div class="card">
    <div class="card-title"><span>Color</span><span class="arrow">›</span></div>
    <div class="setting-row"><span>Text</span><div class="value-pill"><label class="color-dot" style="background:#fff" for="textColor"></label><span class="hex" id="textHex">#ffffff</span><input type="color" id="textColor" value="#ffffff" onchange="setColor(this,'textHex')"></div></div>
    <div class="setting-row"><span>Bg</span><div class="value-pill"><label class="color-dot purple" for="bgColor"></label><span class="hex" id="bgHex">#B009DB</span><input type="color" id="bgColor" value="#b009db" onchange="setColor(this,'bgHex')"></div></div>
    <div class="setting-row"><span>Hover bg</span><div class="value-pill"><label class="color-dot pink" for="hoverColor"></label><span class="hex" id="hoverHex">#DD63FC</span><input type="color" id="hoverColor" value="#dd63fc" onchange="setColor(this,'hoverHex')"></div></div>
   </div>
   <div class="card button-card">
    <div class="card-title"><span>Button options</span><span class="arrow">›</span></div>
    <div class="setting-row"><span>Font</span><div class="value-pill"><div class="select-wrap"><select class="font-select" aria-label="Font"><option>Inter Tight</option><option>Inter</option><option>Arial</option><option>Georgia</option><option>Roboto</option></select></div></div></div>
    <div class="setting-row"><span>Weight</span><div class="value-pill"><div class="select-wrap"><select class="font-select" aria-label="Weight"><option>500 - Bold</option><option>400 - Regular</option><option>600 - Semi Bold</option><option>700 - Extra Bold</option></select></div></div></div>
    <div class="setting-row"><span>Size</span><div class="size-row"><div class="compact-pill"><span id="sizeValue">16</span>&nbsp; PX</div><div class="vdivider"></div><div class="compact-pill">|A|&nbsp; <span id="trackingValue">-3</span>&nbsp;%</div></div></div>
    <div class="setting-row"><span>Align</span><div class="alignment">
      <button class="align-btn" title="左对齐" onclick="selectAlign(this)"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9h11M4 13h16M4 17h11M4 21h16"/></svg></button>
      <button class="align-btn active" title="居中" onclick="selectAlign(this)"><svg viewBox="0 0 24 24"><path d="M3 5h18M6 9h12M3 13h18M6 17h12M3 21h18"/></svg></button>
      <button class="align-btn" title="右对齐" onclick="selectAlign(this)"><svg viewBox="0 0 24 24"><path d="M4 5h16M9 9h11M4 13h16M9 17h11M4 21h16"/></svg></button>
     </div></div>
    <div class="setting-row"><span>Style</span><div class="style-pill">
      <button class="style-btn active" onclick="toggleStyle(this)" title="粗体"><b>I</b></button>
      <button class="style-btn" onclick="toggleStyle(this)" title="斜体"><i>I</i></button><span class="style-sep"></span>
      <button class="style-btn active" onclick="toggleStyle(this)" title="顶部对齐">↟</button>
      <button class="style-btn" onclick="toggleStyle(this)" title="垂直居中">↕</button>
      <button class="style-btn" onclick="toggleStyle(this)" title="底部对齐">↡</button>
     </div></div>
   </div>
   <button class="ai-button" onclick="openAI()"><span>✧</span> Help with AI</button>
  </section>

  <!-- Right: top actions and layout controls -->
  <section class="right">
   <div class="toolbar">
    <div class="tool-left">
     <button class="circle-tool" title="桌面预览" onclick="notify('已切换桌面预览')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13"/><path d="M8 21h8m-4-4v4"/></svg></button>
     <button class="circle-tool" title="播放预览" onclick="notify('正在预览页面')"><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></svg></button>
    </div>
    <button class="top-action" onclick="share()">Share</button>
    <div class="save-wrap"><button class="save" onclick="toggleSave()">Save <span class="down">▾</span></button><div class="save-menu" id="saveMenu"><button onclick="saveAction('Save changes')">Save changes</button><button onclick="saveAction('Save as template')">Save as template</button><button onclick="saveAction('Export HTML')">Export HTML</button></div></div>
   </div>
   <div class="panel right-card padding-card">
    <div class="card-title"><span>Padding</span><span class="arrow">›</span></div>
    <div class="padding-diagram">
     <span class="top" id="padTop">8</span><span class="bottom" id="padBottom">8</span><span class="left-label">Auto</span><span class="right-label">Auto</span><div class="padding-center"></div>
    </div>
    <label class="checkline"><input type="checkbox" checked id="fillContainer" onchange="notify(this.checked?'Fill container enabled':'Fill container disabled')"> Fill container</label>
   </div>
   <div class="panel right-card link-card">
    <div class="card-title"><span>Link</span><span class="arrow">›</span></div>
    <div class="link-row">
     <select class="type-select" aria-label="Link type"><option>Type</option><option>Website</option><option>Email</option><option>Phone</option></select>
     <label class="url-field"><input id="urlInput" value="https://ecraft.com..." aria-label="Link URL" oninput="validateLink()"><span class="valid" id="validMark">✓</span></label>
    </div>
   </div>
  </section>
 </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal">
 <div class="modal"><h3>Help with AI</h3><p>告诉 MotionCraft 你想调整的内容，例如「让按钮更醒目」或「统一页面的字体和间距」。</p><input id="aiPrompt" placeholder="Describe what you'd like to change..." style="width:100%;height:43px;border:1px solid #e8e5ed;border-radius:11px;padding:0 12px;outline:none"><div class="modal-actions"><button onclick="closeAI()">Cancel</button><button class="primary" onclick="submitAI()">Generate</button></div></div>
</div>
<script>
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function toggleAccordion(id){const el=document.getElementById(id);el.classList.toggle('collapsed');const body=el.querySelector('.acc-body');body.style.display=el.classList.contains('collapsed')?'none':'block'}
function switchLibrary(mode,btn){document.querySelectorAll('.switch[data-mode]').forEach(x=>x.classList.toggle('active',x===btn));if(mode==='rows'){notify('Rows layout selected')}else{notify('Content library selected')}}
function toggleSearch(){const box=document.getElementById('searchBox');box.style.display=box.style.display==='none'?'block':'none';if(box.style.display==='block')document.getElementById('searchInput').focus()}
function insertItem(name){notify(name+' added to your page')}
function setColor(input,id){document.getElementById(id).textContent=input.value.toUpperCase();const dot=input.parentElement.querySelector('.color-dot');dot.style.background=input.value;notify('Color updated')}
function selectAlign(btn){btn.parentElement.querySelectorAll('.align-btn').forEach(x=>x.classList.toggle('active',x===btn))}
function toggleStyle(btn){btn.classList.toggle('active')}
function toggleSave(){document.getElementById('saveMenu').classList.toggle('show')}
function saveAction(action){document.getElementById('saveMenu').classList.remove('show');notify(action+' completed')}
function share(){if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>notify('Share link copied')).catch(()=>notify('Share options opened'))}else notify('Share options opened')}
function validateLink(){const input=document.getElementById('urlInput'),mark=document.getElementById('validMark');let ok=/^(https?:\/\/|mailto:|tel:)/i.test(input.value);mark.textContent=ok?'✓':'!';mark.style.background=ok?'#20c64d':'#ef9c45'}
function openAI(){document.getElementById('modal').classList.add('show');document.getElementById('aiPrompt').focus()}
function closeAI(){document.getElementById('modal').classList.remove('show')}
function submitAI(){const val=document.getElementById('aiPrompt').value.trim();closeAI();notify(val?'AI suggestion is ready':'Enter a request first')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeAI()});
document.addEventListener('click',e=>{if(!e.target.closest('.save-wrap'))document.getElementById('saveMenu').classList.remove('show')});
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.content-item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')});
</script>
</body>
</html>
